name: Question
description: Ask how to do something with HyScribe.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [operator documentation](https://github.com/hyscaler/HyScribe/tree/main/docs/operators) covers installing, configuring, running the service and switching back to PHP WordPress.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you have tried.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HyScribe version
      placeholder: v0.1.0
  - type: input
    id: wordpress
    attributes:
      label: WordPress version of the site
      placeholder: "7.1.3"
