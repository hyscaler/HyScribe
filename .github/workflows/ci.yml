# SPDX-License-Identifier: AGPL-3.0-or-later
# Gates from docs/TESTING.md and docs/SECURITY_MODEL.md. Actions are
# pinned to commit SHAs.
#
# Every job runs on the self-hosted runner of the CI machine (label hyscribe), inside
# a throwaway container of a pinned Rust image: nothing stays on the machine
# between jobs except the named cache volumes hyscribe-cargo (cargo home and
# tools) and hyscribe-sccache. The runner takes only pushes to development
# and main and manual runs, never pull requests (a pull request from a fork
# would run its code on that machine). Fixture containers start through the
# runner's rootless Docker (scripts/ci-net.sh joins them to the job).
# Mutation testing runs before a merge, not here.
name: CI

on:
  push:
    branches: [development, main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes the run in progress for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache

jobs:
  checks:
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        SCCACHE_DIR: /cache/sccache
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
        - hyscribe-sccache:/cache/sccache
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 40
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tools (system packages, cargo tools from the cache volume)
        env:
          RUSTC_WRAPPER: ""
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh sccache@0.19.0 cargo-deny@0.21.0 cargo-audit@0.23.0 cargo-vet@0.10.3
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: SPDX header in every source file
        run: |
          # Test corpora copied from WordPress keep their own license;
          # supply-chain/ is generated by cargo-vet.
          missing=$(git ls-files '*.rs' '*.toml' '*.php' '*.sh' ':!crates/*/tests/corpus/*' ':!supply-chain/*' \
            | xargs grep -L 'SPDX-License-Identifier: AGPL-3.0-or-later' || true)
          if [ -n "$missing" ]; then echo "Missing SPDX header:"; echo "$missing"; exit 1; fi
      - run: cargo deny check
      - run: cargo audit
      - name: Every dependency audited or exempted (docs/SECURITY_MODEL.md)
        run: cargo vet --locked
      - name: Install gitleaks, checksum verified
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c
          tar -xzf "$archive" gitleaks
      - name: No secrets anywhere in the history
        run: ./gitleaks git --no-banner --redact --verbose --exit-code 1 .

  coverage:
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        SCCACHE_DIR: /cache/sccache
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
        - hyscribe-sccache:/cache/sccache
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 90
    env:
      HYSCRIBE_DB_CONTAINER: ci-coverage-db-${{ github.run_id }}
      HYSCRIBE_REF_NETWORK: ci-coverage-ref-${{ github.run_id }}
      HYSCRIBE_DB_PORT: "33991"
      HYSCRIBE_TEST_DB_PORT: "33991"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (system packages, cargo tools from the cache volume)
        env:
          RUSTC_WRAPPER: ""
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh sccache@0.19.0 cargo-llvm-cov@0.9.1
      - run: rustup component add llvm-tools-preview
      - name: Theme Test Data fixture, downloaded pinned, never committed
        run: reference/theme-test-data/build.sh
      - name: Default install fixture in MariaDB (hyscribe-db tests)
        run: |
          scripts/ci-net.sh up "$HYSCRIBE_REF_NETWORK" 33991=db:3306
          reference/default-install/db.sh up
      - name: Tests with the 100% gate (ADR 0007)
        run: |
          cargo llvm-cov --workspace --ignore-filename-regex '/tests/' \
            --fail-under-lines 100 --fail-under-regions 100 \
            --lcov --output-path lcov.info
      - run: cargo llvm-cov report --ignore-filename-regex '/tests/' --summary-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/lcov.info
      - name: Remove the fixture containers
        if: always()
        run: |
          reference/default-install/db.sh down || true
          scripts/ci-net.sh down "$HYSCRIBE_REF_NETWORK"

  package:
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        SCCACHE_DIR: /cache/sccache
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
        - hyscribe-sccache:/cache/sccache
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 40
    env:
      HYSCRIBE_DB_CONTAINER: ci-package-db-${{ github.run_id }}
      HYSCRIBE_REF_NETWORK: ci-package-ref-${{ github.run_id }}
      HYSCRIBE_DB_PORT: "33992"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (system packages, cargo tools from the cache volume)
        env:
          RUSTC_WRAPPER: ""
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh sccache@0.19.0
      - run: rustup target add x86_64-unknown-linux-musl
      - name: Release archive installs and serves the default install (ADR 0005)
        run: |
          scripts/ci-net.sh up "$HYSCRIBE_REF_NETWORK" 33992=db:3306
          reference/default-install/db.sh up
          scripts/package.sh x86_64-unknown-linux-musl dist
          scripts/smoke-test.sh dist/hyscribe_*_linux_amd64.tar.gz
      - name: Remove the fixture containers
        if: always()
        run: |
          reference/default-install/db.sh down || true
          scripts/ci-net.sh down "$HYSCRIBE_REF_NETWORK"

  fuzz:
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        SCCACHE_DIR: /cache/sccache
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
        - hyscribe-sccache:/cache/sccache
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (system packages, cargo tools from the cache volume)
        env:
          RUSTC_WRAPPER: ""
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh sccache@0.19.0 cargo-fuzz@0.13.2
      - run: rustup toolchain install nightly --profile minimal
      - name: Short fuzz run of every target
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            # The image targets start from the review's hostile cases too.
            seeds=()
            case $target in image_*) mkdir -p "corpus/$target"; seeds=("corpus/$target" ../crates/hyscribe-image/tests/hostile) ;; esac
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" "${seeds[@]}" -- -max_total_time=60
          done
