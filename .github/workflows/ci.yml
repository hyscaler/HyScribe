# SPDX-License-Identifier: AGPL-3.0-or-later
# Gates from docs/TESTING.md and docs/SECURITY_MODEL.md. Actions are
# pinned to commit SHAs.
#
# The Linux jobs run on the project's self-hosted runners (label hyscribe),
# inside a throwaway container of a pinned Rust image: nothing stays on a
# machine between jobs except the named cache volumes hyscribe-cargo (cargo
# home and tools) and hyscribe-sccache. The gates run for a release tag (v*)
# and by hand; never for pull requests (a pull request from a fork would run
# its code on those machines). The same gates are run before every merge.
# The runners' paths come from the repository variables HYSCRIBE_CI_WORK,
# HYSCRIBE_CI_DOCKER and HYSCRIBE_CI_FIXTURES, and a runner frees them after
# every job. Fixture containers start through the runner's rootless Docker
# (scripts/ci-net.sh joins them to the job). Mutation testing is not run
# here. The containers run as root; the steps that run HyScribe or its tests
# go through scripts/ci-as-user.sh, as the ordinary user they expect.
#
# Two runners take one job each, so the Linux jobs form two chains and never
# more than two are ready at once:
#   coverage -> switch-back -> screenshots
#   checks -> package -> fuzz
# A chain is an order, not a condition: package and fuzz run whatever came
# before them, so one run reports every gate; switch-back and screenshots
# wait for the tests to pass. A runner takes one job at a time, and what a
# job starts on its machine is its own by name: its containers and network
# carry the run's id or the job's own fixture port, and no two jobs share a
# port, so only a leftover could collide, and every job removes its
# containers when it ends, however it ends. A job's containers get 12 CPUs
# of processor time while counting more, so CARGO_BUILD_JOBS and
# RUST_TEST_THREADS say 12 (coverage keeps its 4 test threads).
#
# The macos job runs on a GitHub-hosted macOS runner, which has no Docker:
# clippy and a build of the binary for both macOS targets, and the tests of
# the crates that need neither the fixture database nor the Theme Test Data.
# The full suite (the PHP and MariaDB oracle, coverage, the switch-back
# suite, the screenshots, fuzzing) runs on Linux only.
#
# For a release tag, the release workflow is called once every job here has
# passed, so nothing is built for publishing before the gates are green.
name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: After the gates, also run the release build, publishing nothing
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes the run in progress for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache

jobs:
  checks:
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        CARGO_BUILD_JOBS: "12"
        RUST_TEST_THREADS: "12"
        SCCACHE_DIR: /cache/sccache
        SCCACHE_CACHE_SIZE: 10G
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
        - hyscribe-sccache:/cache/sccache
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 40
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tools (system packages, cargo tools from the cache volume)
        env:
          RUSTC_WRAPPER: ""
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh sccache@0.19.0 cargo-deny@0.21.0 cargo-audit@0.23.0 cargo-vet@0.10.3
      - name: Tag matches the workspace version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME"
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: SPDX header in every source file
        run: |
          # Test corpora copied from WordPress keep their own license;
          # supply-chain/ is generated by cargo-vet. The extension SDK and the
          # test extension built on it are Apache-2.0 OR MIT.
          sdk=(':crates/hyscribe-sdk/*' ':crates/hyscribe-ext/guest/*')
          missing=$( (git ls-files '*.rs' '*.toml' '*.php' '*.sh' ':!crates/*/tests/corpus/*' ':!supply-chain/*' \
              ':!crates/hyscribe-sdk/*' ':!crates/hyscribe-ext/guest/*' \
              | xargs grep -L 'SPDX-License-Identifier: AGPL-3.0-or-later'
            git ls-files "${sdk[@]}" | grep -E '\.(rs|toml|sh)$' \
              | xargs grep -L 'SPDX-License-Identifier: Apache-2.0 OR MIT') || true)
          if [ -n "$missing" ]; then echo "Missing SPDX header:"; echo "$missing"; exit 1; fi
      - run: cargo deny check
      - run: cargo audit
      - name: Every dependency audited or exempted (docs/SECURITY_MODEL.md)
        run: cargo vet --locked
      - name: Install gitleaks, checksum verified
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c
          tar -xzf "$archive" gitleaks
      - name: No secrets anywhere in the history
        run: ./gitleaks git --no-banner --redact --verbose --exit-code 1 .

  coverage:
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        CARGO_BUILD_JOBS: "12"
        RUST_TEST_THREADS: "12"
        SCCACHE_DIR: /cache/sccache
        SCCACHE_CACHE_SIZE: 10G
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
        - hyscribe-sccache:/cache/sccache
        - ${{ vars.HYSCRIBE_CI_FIXTURES }}:${{ vars.HYSCRIBE_CI_FIXTURES }}:ro
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 90
    env:
      HYSCRIBE_DB_CONTAINER: ci-coverage-db-${{ github.run_id }}
      HYSCRIBE_REF_NETWORK: ci-coverage-ref-${{ github.run_id }}
      HYSCRIBE_DB_PORT: "28991"
      HYSCRIBE_TEST_DB_PORT: "28991"
      HYSCRIBE_CI_FIXTURES: ${{ vars.HYSCRIBE_CI_FIXTURES }}
      # The fixture database takes a few test connections at a time.
      RUST_TEST_THREADS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (system packages, cargo tools from the cache volume)
        env:
          RUSTC_WRAPPER: ""
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh sccache@0.19.0 cargo-llvm-cov@0.9.1
      - run: rustup component add llvm-tools-preview
      - run: scripts/ci-as-user.sh prepare
      - name: Theme Test Data fixture, the one the goldens were recorded on
        # A rebuilt fixture differs in its install dates, so the goldens'
        # hashes need this one, supplied through HYSCRIBE_CI_FIXTURES (the
        # data has no licence, so it is never committed).
        # reference/theme-test-data/build.sh makes a new one.
        run: |
          mkdir -p target/fixtures
          ln -sfn "$HYSCRIBE_CI_FIXTURES/theme-test-data" target/fixtures/theme-test-data
          test -f target/fixtures/theme-test-data/7.1.3/database.sql
      - name: Default install fixture in MariaDB (hyscribe-db tests)
        run: |
          scripts/ci-net.sh up "$HYSCRIBE_REF_NETWORK" 28991=db:3306
          reference/default-install/db.sh up
      - name: Tests with the 100% gate (ADR 0007)
        run: |
          scripts/ci-as-user.sh cargo llvm-cov --workspace --ignore-filename-regex '/tests/' \
            --fail-under-lines 100 --fail-under-regions 100 \
            --lcov --output-path target/lcov.info
      - run: scripts/ci-as-user.sh cargo llvm-cov report --ignore-filename-regex '/tests/' --summary-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/lcov.info
      - name: Remove the fixture containers
        if: always()
        run: |
          reference/default-install/db.sh down || true
          scripts/ci-net.sh down "$HYSCRIBE_REF_NETWORK"

  package:
    # After checks, on the same chain: see the note on the two chains above.
    needs: [checks]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        CARGO_BUILD_JOBS: "12"
        RUST_TEST_THREADS: "12"
        SCCACHE_DIR: /cache/sccache
        SCCACHE_CACHE_SIZE: 10G
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
        - hyscribe-sccache:/cache/sccache
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 40
    env:
      HYSCRIBE_DB_CONTAINER: ci-package-db-${{ github.run_id }}
      HYSCRIBE_REF_NETWORK: ci-package-ref-${{ github.run_id }}
      HYSCRIBE_DB_PORT: "28992"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (system packages, cargo tools from the cache volume)
        env:
          RUSTC_WRAPPER: ""
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh sccache@0.19.0
      - run: rustup target add x86_64-unknown-linux-musl
      - name: Release archive installs and serves the default install (ADR 0005)
        run: |
          scripts/ci-net.sh up "$HYSCRIBE_REF_NETWORK" 28992=db:3306
          reference/default-install/db.sh up
          scripts/package.sh x86_64-unknown-linux-musl dist
          scripts/ci-as-user.sh prepare
          scripts/ci-as-user.sh scripts/smoke-test.sh dist/hyscribe_*_linux_amd64.tar.gz
      - name: Remove the fixture containers
        if: always()
        run: |
          reference/default-install/db.sh down || true
          scripts/ci-net.sh down "$HYSCRIBE_REF_NETWORK"

  switch-back:
    # The switch-back suite (MVP 8.5, GOALS S7), over both fixtures.
    needs: [coverage]
    if: ${{ !cancelled() && needs.coverage.result == 'success' }}
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        CARGO_BUILD_JOBS: "12"
        RUST_TEST_THREADS: "12"
        SCCACHE_DIR: /cache/sccache
        SCCACHE_CACHE_SIZE: 10G
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
        - hyscribe-sccache:/cache/sccache
        - ${{ vars.HYSCRIBE_CI_FIXTURES }}:${{ vars.HYSCRIBE_CI_FIXTURES }}:ro
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 90
    env:
      HYSCRIBE_DB_CONTAINER: ci-switchback-db-${{ github.run_id }}
      HYSCRIBE_REF_NETWORK: ci-switchback-ref-${{ github.run_id }}
      HYSCRIBE_PHP_CONTAINER: ci-switchback-php-${{ github.run_id }}
      HYSCRIBE_DB_PORT: "28994"
      HYSCRIBE_TEST_DB_PORT: "28994"
      HYSCRIBE_PHP_PORT: "8094"
      HYSCRIBE_CI_FIXTURES: ${{ vars.HYSCRIBE_CI_FIXTURES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (system packages, cargo tools from the cache volume)
        env:
          RUSTC_WRAPPER: ""
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh sccache@0.19.0
      - run: scripts/ci-as-user.sh prepare
      - name: Theme Test Data fixture, the one the goldens were recorded on
        run: |
          mkdir -p target/fixtures
          ln -sfn "$HYSCRIBE_CI_FIXTURES/theme-test-data" target/fixtures/theme-test-data
          test -f target/fixtures/theme-test-data/7.1.3/database.sql
      - name: Fixture network and port forwards
        run: scripts/ci-net.sh up "$HYSCRIBE_REF_NETWORK" "28994=db:3306" "8094=$HYSCRIBE_PHP_CONTAINER:80"
      - name: Docker for the tests' SQL steps (they run as the ordinary user)
        run: scripts/ci-docker-proxy.sh
      - name: Switch back to PHP WordPress, default install
        run: |
          # The runner rewrites _work paths in a step's environment to /__w,
          # which the host's Docker cannot mount: the scripts get the host
          # path (also mounted in the job) from this literal.
          ws=${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
          # World writable folders: HyScribe's test runs as the ordinary user.
          (umask 000; CARGO="$ws/scripts/ci-cargo.sh" "$ws/reference/switch-back/run.sh" "$ws/target/switch-back/default")
      - name: Switch back to PHP WordPress, Theme Test Data
        run: |
          ws=${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
          (umask 000; HYSCRIBE_SWITCH_BACK_FIXTURE=ttd CARGO="$ws/scripts/ci-cargo.sh" "$ws/reference/switch-back/run.sh" "$ws/target/switch-back/ttd")
      - name: Logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: switch-back-logs
          path: |
            ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/switch-back/**/*.log
            ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/switch-back/**/*.tsv
            ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/switch-back/**/*.html
      - name: Remove the fixture containers
        if: always()
        run: |
          reference/default-install/php.sh down || true
          reference/default-install/db.sh down || true
          scripts/ci-net.sh down "$HYSCRIBE_REF_NETWORK"

  screenshots:
    # The screenshot comparison (GOALS S8): PHP and HyScribe, pixel by pixel.
    needs: [coverage, switch-back]
    if: ${{ !cancelled() && needs.coverage.result == 'success' }}
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        CARGO_BUILD_JOBS: "12"
        RUST_TEST_THREADS: "12"
        SCCACHE_DIR: /cache/sccache
        SCCACHE_CACHE_SIZE: 10G
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
        - hyscribe-sccache:/cache/sccache
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 90
    env:
      HYSCRIBE_DB_CONTAINER: ci-shots-db-${{ github.run_id }}
      HYSCRIBE_REF_NETWORK: ci-shots-ref-${{ github.run_id }}
      HYSCRIBE_DB_PORT: "28995"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (system packages, cargo tools from the cache volume)
        env:
          RUSTC_WRAPPER: ""
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh sccache@0.19.0
      - run: rustup target add x86_64-unknown-linux-musl
      - name: Release binary (musl, so it runs in the browser image)
        run: |
          CC_x86_64_unknown_linux_musl=clang cargo build --release --locked -p hyscribe --target x86_64-unknown-linux-musl
      - name: The pinned themes, which php.sh mounts into the PHP oracle
        run: reference/themes/pin.sh
      - name: Fixture network and the PHP container's port forward (php.sh waits for it)
        run: scripts/ci-net.sh up "$HYSCRIBE_REF_NETWORK" "28996=hs-shots-php-$HYSCRIBE_DB_PORT:80"
      - name: Screenshots of every screen, PHP against HyScribe
        env:
          HYSCRIBE_BIN: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/x86_64-unknown-linux-musl/release/hyscribe
        run: |
          # The host path of the checkout, for the bind mounts (see the switch-back job).
          ws=${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
          "$ws/reference/screenshots/golden.sh" "$ws/target/screenshots"
      - name: Report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-report
          path: |
            ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/screenshots/report.html
            ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/screenshots/report.tsv
            ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/screenshots/hyscribe.log
            ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/screenshots/diff-*.png
      - name: Remove the fixture containers
        if: always()
        run: |
          docker rm -f "hs-shots-php-$HYSCRIBE_DB_PORT" "hs-shots-hyscribe-$HYSCRIBE_DB_PORT" || true
          reference/default-install/db.sh down || true
          scripts/ci-net.sh down "$HYSCRIBE_REF_NETWORK"

  fuzz:
    # Last on its chain, beside the other chain's last jobs: with the tests it
    # is the longest job.
    needs: [checks, package]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        CARGO_BUILD_JOBS: "12"
        RUST_TEST_THREADS: "12"
        SCCACHE_DIR: /cache/sccache
        SCCACHE_CACHE_SIZE: 10G
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
        - hyscribe-sccache:/cache/sccache
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (system packages, cargo tools from the cache volume)
        env:
          RUSTC_WRAPPER: ""
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh sccache@0.19.0 cargo-fuzz@0.13.2
      - run: rustup toolchain install nightly --profile minimal
      - name: Short fuzz run of every target
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            # The image targets start from the review's hostile cases too, the
            # QuickTime one from the MP4 samples.
            seeds=()
            case $target in
              image_*) mkdir -p "corpus/$target"; seeds=("corpus/$target" ../crates/hyscribe-image/tests/hostile) ;;
              upload_quicktime) mkdir -p "corpus/$target"; seeds=("corpus/$target" ../crates/hyscribe-image/tests/mp4) ;;
            esac
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" "${seeds[@]}" -- -max_total_time=30
          done

  macos:
    # What runs on macOS without Docker; the header says what does not.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: "1.100.0" # the Rust of the Linux jobs' image
      # No compile cache on the hosted runner.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust, with both macOS targets and the test extension's
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy \
            --target aarch64-apple-darwin --target x86_64-apple-darwin --target wasm32-wasip2
          rustc --version
          uname -m
      - name: Clippy for Apple Silicon
        run: cargo clippy --workspace --all-targets --locked --target aarch64-apple-darwin -- -D warnings
      - name: Clippy for Intel
        run: cargo clippy --workspace --all-targets --locked --target x86_64-apple-darwin -- -D warnings
      - name: The binary builds for both
        run: |
          cargo build --locked -p hyscribe --target aarch64-apple-darwin
          cargo build --locked -p hyscribe --target x86_64-apple-darwin
      - name: Tests of the crates that need no database and no Theme Test Data
        run: |
          # Natively for Apple Silicon, then the Intel build under Rosetta.
          arch -x86_64 /usr/bin/true || { echo "Rosetta is not installed on this runner" >&2; exit 1; }
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo test --locked --target "$target" \
              -p hyscribe-assets -p hyscribe-auth -p hyscribe-config -p hyscribe-ext \
              -p hyscribe-fetch -p hyscribe-html -p hyscribe-image -p hyscribe-kses \
              -p hyscribe-mail -p hyscribe-model -p hyscribe-phpser -p hyscribe-registry \
              -p hyscribe-sdk -p hyscribe-service -p hyscribe-theme-json
          done

  release:
    # The release build and, for a tag, the publication: only once every gate
    # above has passed. By hand it is a rehearsal that publishes nothing.
    needs: [checks, coverage, package, switch-back, screenshots, fuzz, macos]
    if: >-
      ${{ !cancelled()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && !contains(needs.*.result, 'skipped')
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.release_dry_run) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
