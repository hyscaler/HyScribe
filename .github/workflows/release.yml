# SPDX-License-Identifier: AGPL-3.0-or-later
# Release archives for a version tag (ADR 0005, docs/SECURITY_MODEL.md):
# reproducible static builds, SHA256SUMS.txt, an SBOM and signed build
# provenance. Actions are pinned to commit SHAs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build and package
        run: scripts/package.sh ${{ matrix.target }} dist
      - name: Rebuilding gives the same bytes
        run: |
          sha256sum dist/hyscribe_*.tar.gz > first.txt
          cargo clean --release --target ${{ matrix.target }} -p hyscribe
          scripts/package.sh ${{ matrix.target }} dist
          sha256sum -c first.txt
      - name: Smoke test
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: scripts/smoke-test.sh dist/hyscribe_*_linux_amd64.tar.gz
      - name: Runs under emulation
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user-static
          tar -xzf dist/hyscribe_*_linux_arm64.tar.gz -C "$RUNNER_TEMP"
          qemu-aarch64-static "$RUNNER_TEMP/hyscribe/hyscribe" version | grep -q AGPL-3.0-or-later
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-cyclonedx
      - name: SBOM
        run: |
          cargo cyclonedx --manifest-path crates/hyscribe/Cargo.toml --format json \
            --spec-version 1.5 --target x86_64-unknown-linux-musl --no-build-deps \
            --override-filename hyscribe-sbom.cdx
          mv crates/hyscribe/hyscribe-sbom.cdx.json dist/
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.json > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/hyscribe-sbom.cdx.json
            dist/SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "HyScribe $GITHUB_REF_NAME" --generate-notes --draft
