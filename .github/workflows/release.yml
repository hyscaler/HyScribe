# SPDX-License-Identifier: AGPL-3.0-or-later
# Release archives for a version tag (ADR 0005, docs/SECURITY_MODEL.md):
# reproducible builds, SHA256SUMS.txt, SBOMs and signed build provenance.
# Actions are pinned to commit SHAs. The Linux jobs run on the self-hosted
# runners in throwaway containers, as ci.yml's do; a tag is pushed by
# someone with write access, never by a fork. The release builds use no
# compile cache, so the bytes stay reproducible.
#
# The macOS archives are built and smoke-tested on a GitHub-hosted macOS
# runner, one job for each architecture, never cross-compiled from Linux,
# and the Windows archive likewise on a GitHub-hosted Windows runner. Those
# jobs use none of the self-hosted runners' variables or containers.
#
# A v* tag does not start this workflow by itself: ci.yml calls it for the
# tag once every one of its gates has passed (its release job), and only
# that run publishes. The reason for a called workflow over a second
# workflow started by the tag or by ci.yml's completion: the release then
# waits for the gates through an ordinary `needs`, in one run, with the
# tag as its ref, so the version check and the provenance still name the tag.
#
# The release is left as a draft. Publishing it starts docker.yml, which
# builds the container image from the published Linux archives.
name: Release

on:
  # Called by ci.yml: for a pushed v* tag it publishes; from a manual CI run
  # it is a rehearsal that publishes nothing.
  workflow_call:
  # A manual run builds, tests and packages everything and prepares the
  # release assets, but publishes nothing (no release, upload or
  # attestation), whatever dry_run says: only a pushed v* tag publishes.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        CARGO_BUILD_JOBS: "12"
        RUST_TEST_THREADS: "12"
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 120
    env:
      HYSCRIBE_DB_CONTAINER: ci-release-db-${{ github.run_id }}
      HYSCRIBE_REF_NETWORK: ci-release-ref-${{ github.run_id }}
      HYSCRIBE_PHP_CONTAINER: ci-release-php-${{ github.run_id }}
      HYSCRIBE_DB_PORT: "28993"
      HYSCRIBE_TEST_DB_PORT: "28993"
      HYSCRIBE_PHP_PORT: "8093"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh
      - run: rustup target add ${{ matrix.target }}
      - name: musl's headers for arm64 (wasmtime's C helpers)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          dpkg --add-architecture arm64
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends musl-dev:arm64
      - name: Tag matches the workspace version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build and package
        run: scripts/package.sh ${{ matrix.target }} dist
      - name: Rebuilding gives the same bytes
        run: |
          sha256sum dist/hyscribe_*.tar.gz > first.txt
          cargo clean --release --target ${{ matrix.target }} -p hyscribe
          scripts/package.sh ${{ matrix.target }} dist
          sha256sum -c first.txt
      - name: Smoke test
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          scripts/ci-net.sh up "$HYSCRIBE_REF_NETWORK" 28993=db:3306
          reference/default-install/db.sh up
          scripts/ci-as-user.sh prepare
          scripts/ci-as-user.sh scripts/smoke-test.sh dist/hyscribe_*_linux_amd64.tar.gz
      - name: Docker for the tests' SQL steps (they run as the ordinary user)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: scripts/ci-docker-proxy.sh
      - name: Switch back to PHP WordPress (MVP 8.5, GOALS S7)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          scripts/ci-net.sh up "$HYSCRIBE_REF_NETWORK" "8093=$HYSCRIBE_PHP_CONTAINER:80"
          scripts/ci-as-user.sh prepare
          # The runner rewrites _work paths in a step's environment to /__w,
          # which the host's Docker cannot mount: the scripts get the host
          # path (also mounted in the job) from this literal.
          ws=${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
          # World writable folders: HyScribe's test runs as the ordinary user.
          (umask 000; CARGO="$ws/scripts/ci-cargo.sh" "$ws/reference/switch-back/run.sh" "$ws/target/switch-back/default")
      - name: Logs of a failed run
        if: failure() && matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: switch-back-logs
          path: |
            ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/switch-back/**/*.log
            ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/switch-back/**/*.tsv
      - name: Remove the fixture containers
        if: always() && matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          reference/default-install/php.sh down || true
          reference/default-install/db.sh down || true
          scripts/ci-net.sh down "$HYSCRIBE_REF_NETWORK"
      - name: Runs under emulation
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends qemu-user-static
          tar -xzf dist/hyscribe_*_linux_arm64.tar.gz -C "$RUNNER_TEMP"
          qemu-aarch64-static "$RUNNER_TEMP/hyscribe/hyscribe" version | grep -q AGPL-3.0-or-later
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/dist/*.tar.gz

  build-macos:
    # GitHub-hosted, with no Docker: the fixture database of the smoke test
    # is a MariaDB installed on the runner (reference/default-install/db-native.sh).
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: "1.100.0" # the Rust of the Linux jobs' image
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust and the target
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustc --version
          sw_vers
          uname -m
          /bin/bash --version | head -n 1
      - name: GNU tar for the archive, MariaDB for the smoke test
        run: |
          brew install gnu-tar mariadb@11.8
          echo "$(brew --prefix mariadb@11.8)/bin" >> "$GITHUB_PATH"
      - name: Tag matches the workspace version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build and package, with macOS's own bash 3.2
        run: /bin/bash scripts/package.sh ${{ matrix.target }} dist
      - name: Rebuilding gives the same bytes
        run: |
          shasum -a 256 dist/hyscribe_*.tar.gz > first.txt
          cargo clean --release --target ${{ matrix.target }} -p hyscribe
          /bin/bash scripts/package.sh ${{ matrix.target }} dist
          shasum -a 256 -c first.txt
      - name: The binary is for this architecture and for macOS 11 and later
        run: |
          case ${{ matrix.target }} in aarch64-*) arch=arm64 ;; *) arch=x86_64 ;; esac
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf dist/hyscribe_*_darwin_*.tar.gz -C "$RUNNER_TEMP/unpacked"
          binary="$RUNNER_TEMP/unpacked/hyscribe/hyscribe"
          file "$binary"
          test "$(lipo -archs "$binary")" = "$arch"
          otool -L "$binary"
          otool -l "$binary" | grep -A 4 LC_BUILD_VERSION
          otool -l "$binary" | grep -A 4 LC_BUILD_VERSION | grep -q 'minos 11\.0$'
      - name: Rosetta, which runs the Intel binary on this Apple Silicon runner
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          test "$(uname -m)" = arm64
          arch -x86_64 /usr/bin/true || { echo "Rosetta is not installed on this runner" >&2; exit 1; }
      - name: Smoke test
        run: |
          reference/default-install/db-native.sh up
          /bin/bash scripts/smoke-test.sh dist/hyscribe_*_darwin_*.tar.gz
      - name: Stop the fixture database
        if: always()
        run: reference/default-install/db-native.sh down || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz

  build-windows:
    # GitHub-hosted, with no Docker: the smoke test's fixture database is
    # MariaDB's own zip for Windows, checksum verified, run from Git for
    # Windows's bash by reference/default-install/db-native.sh.
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.100.0" # the Rust of the Linux jobs' image
      TARGET: x86_64-pc-windows-msvc
      MARIADB_VERSION: 11.8.10
      MARIADB_SHA256: 05d04b46763ea3dc9111bfc82dc061e0a158c682a73d31ba34b13f2653c88d17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust and the target
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustc --version
          bash --version | head -n 1
          python --version
          cmd //c ver
      - name: MariaDB for the smoke test, checksum verified
        run: |
          archive="mariadb-$MARIADB_VERSION-winx64.zip"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://archive.mariadb.org/mariadb-$MARIADB_VERSION/winx64-packages/$archive"
          echo "$MARIADB_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c
          7z x -y -bd -o"$RUNNER_TEMP" "$RUNNER_TEMP/$archive" > /dev/null
          echo "$(cygpath -w "$RUNNER_TEMP/mariadb-$MARIADB_VERSION-winx64/bin")" >> "$GITHUB_PATH"
      - name: Tag matches the workspace version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build and package
        run: scripts/package.sh "$TARGET" dist
      - name: Rebuilding gives the same bytes
        run: |
          sha256sum dist/hyscribe_*.zip > first.txt
          cargo clean --release --target "$TARGET" -p hyscribe
          scripts/package.sh "$TARGET" dist
          sha256sum -c first.txt
      - name: The binary needs no runtime besides Windows itself
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          7z x -y -bd -o"$RUNNER_TEMP/unpacked" dist/hyscribe_*_windows_amd64.zip > /dev/null
          binary="$RUNNER_TEMP/unpacked/hyscribe/hyscribe.exe"
          file "$binary" || true
          # Statically linked C runtime: no Visual C++ redistributable.
          if grep -qaiE 'vcruntime[0-9]+\.dll|msvcp[0-9]+\.dll|api-ms-win-crt' "$binary"; then
            echo "the binary links the C runtime dynamically" >&2
            exit 1
          fi
          grep -aoiE '[a-z0-9_.-]+\.dll' "$binary" | tr '[:upper:]' '[:lower:]' | sort -u
      - name: Smoke test
        run: |
          reference/default-install/db-native.sh up
          scripts/smoke-test.sh dist/hyscribe_*_windows_amd64.zip
      - name: Stop the fixture database
        if: always()
        run: reference/default-install/db-native.sh down || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist/*.zip

  publish:
    needs: [build, build-macos, build-windows]
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        CARGO_BUILD_JOBS: "12"
        RUST_TEST_THREADS: "12"
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh cargo-cyclonedx@0.5.10
          apt-get install -y -qq --no-install-recommends gh
          gh --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/dist
          # The archives only: called from ci.yml, the run has other artifacts.
          pattern: dist-*
          merge-multiple: true
      - run: rustup target add x86_64-unknown-linux-musl
      - name: SBOMs, one each for the Linux, the macOS and the Windows archives
        run: |
          # The three systems link a few different crates.
          cargo cyclonedx --manifest-path crates/hyscribe/Cargo.toml --format json \
            --spec-version 1.5 --target x86_64-unknown-linux-musl --no-build-deps \
            --override-filename hyscribe-sbom.cdx
          mv crates/hyscribe/hyscribe-sbom.cdx.json dist/
          cargo cyclonedx --manifest-path crates/hyscribe/Cargo.toml --format json \
            --spec-version 1.5 --target aarch64-apple-darwin --no-build-deps \
            --override-filename hyscribe-sbom-darwin.cdx
          mv crates/hyscribe/hyscribe-sbom-darwin.cdx.json dist/
          cargo cyclonedx --manifest-path crates/hyscribe/Cargo.toml --format json \
            --spec-version 1.5 --target x86_64-pc-windows-msvc --no-build-deps \
            --override-filename hyscribe-sbom-windows.cdx
          mv crates/hyscribe/hyscribe-sbom-windows.cdx.json dist/
      - name: Checksums
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/dist
        run: |
          sha256sum *.tar.gz *.zip *.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/hyscribe-sbom.cdx.json
            dist/hyscribe-sbom-darwin.cdx.json
            dist/hyscribe-sbom-windows.cdx.json
            dist/SHA256SUMS.txt
      - name: Publish the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "HyScribe $GITHUB_REF_NAME" --generate-notes --draft
