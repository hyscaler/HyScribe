# SPDX-License-Identifier: AGPL-3.0-or-later
# Release archives for a version tag (ADR 0005, docs/SECURITY_MODEL.md):
# reproducible static builds, SHA256SUMS.txt, an SBOM and signed build
# provenance. Actions are pinned to commit SHAs. Jobs run on the self-hosted
# runner in throwaway containers, as ci.yml does; a tag is pushed by
# someone with write access, never by a fork. The release builds use no
# compile cache, so the bytes stay reproducible.
name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds, tests and packages everything and prepares the
  # release assets, but publishes nothing (no release, upload or attestation)
  # while dry_run is true. Only a pushed v* tag publishes.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 120
    env:
      HYSCRIBE_DB_CONTAINER: ci-release-db-${{ github.run_id }}
      HYSCRIBE_REF_NETWORK: ci-release-ref-${{ github.run_id }}
      HYSCRIBE_PHP_CONTAINER: ci-release-php-${{ github.run_id }}
      HYSCRIBE_DB_PORT: "28993"
      HYSCRIBE_TEST_DB_PORT: "28993"
      HYSCRIBE_PHP_PORT: "8093"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh
      - run: rustup target add ${{ matrix.target }}
      - name: Tag matches the workspace version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build and package
        run: scripts/package.sh ${{ matrix.target }} dist
      - name: Rebuilding gives the same bytes
        run: |
          sha256sum dist/hyscribe_*.tar.gz > first.txt
          cargo clean --release --target ${{ matrix.target }} -p hyscribe
          scripts/package.sh ${{ matrix.target }} dist
          sha256sum -c first.txt
      - name: Smoke test
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          scripts/ci-net.sh up "$HYSCRIBE_REF_NETWORK" 28993=db:3306
          reference/default-install/db.sh up
          scripts/ci-as-user.sh prepare
          scripts/ci-as-user.sh scripts/smoke-test.sh dist/hyscribe_*_linux_amd64.tar.gz
      - name: Docker for the tests' SQL steps (they run as the ordinary user)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: scripts/ci-docker-proxy.sh
      - name: Switch back to PHP WordPress (MVP 8.5, GOALS S7)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          scripts/ci-net.sh up "$HYSCRIBE_REF_NETWORK" "8093=$HYSCRIBE_PHP_CONTAINER:80"
          scripts/ci-as-user.sh prepare
          # The runner rewrites _work paths in a step's environment to /__w,
          # which the host's Docker cannot mount: the scripts get the host
          # path (also mounted in the job) from this literal.
          ws=${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
          # World writable folders: HyScribe's test runs as the ordinary user.
          (umask 000; CARGO="$ws/scripts/ci-cargo.sh" "$ws/reference/switch-back/run.sh" "$ws/target/switch-back/default")
      - name: Logs of a failed run
        if: failure() && matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: switch-back-logs
          path: |
            ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/switch-back/**/*.log
            ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/target/switch-back/**/*.tsv
      - name: Remove the fixture containers
        if: always() && matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          reference/default-install/php.sh down || true
          reference/default-install/db.sh down || true
          scripts/ci-net.sh down "$HYSCRIBE_REF_NETWORK"
      - name: Runs under emulation
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends qemu-user-static
          tar -xzf dist/hyscribe_*_linux_arm64.tar.gz -C "$RUNNER_TEMP"
          qemu-aarch64-static "$RUNNER_TEMP/hyscribe/hyscribe" version | grep -q AGPL-3.0-or-later
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/dist/*.tar.gz

  publish:
    needs: build
    runs-on: [self-hosted, hyscribe]
    container:
      image: rust@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8 # rust:1-trixie, rustc 1.100
      env:
        CARGO_HOME: /cache/cargo
        DOCKER_HOST: unix://${{ vars.HYSCRIBE_CI_DOCKER }}
        TMPDIR: ${{ vars.HYSCRIBE_CI_WORK }}/_ci-tmp
      volumes:
        - ${{ vars.HYSCRIBE_CI_DOCKER }}:${{ vars.HYSCRIBE_CI_DOCKER }}
        - ${{ vars.HYSCRIBE_CI_WORK }}:${{ vars.HYSCRIBE_CI_WORK }}
        - hyscribe-cargo:/cache/cargo
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          mkdir -p "$TMPDIR"
          scripts/ci-setup.sh cargo-cyclonedx@0.5.10
          apt-get install -y -qq --no-install-recommends gh
          gh --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/dist
          merge-multiple: true
      - run: rustup target add x86_64-unknown-linux-musl
      - name: SBOM
        run: |
          cargo cyclonedx --manifest-path crates/hyscribe/Cargo.toml --format json \
            --spec-version 1.5 --target x86_64-unknown-linux-musl --no-build-deps \
            --override-filename hyscribe-sbom.cdx
          mv crates/hyscribe/hyscribe-sbom.cdx.json dist/
      - name: Checksums
        working-directory: ${{ vars.HYSCRIBE_CI_WORK }}/HyScribe/HyScribe/dist
        run: |
          sha256sum *.tar.gz *.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/hyscribe-sbom.cdx.json
            dist/SHA256SUMS.txt
      - name: Publish the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "HyScribe $GITHUB_REF_NAME" --generate-notes --draft
