# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hyscaler/HyScribe"
publish = false

[workspace.dependencies]
hyscribe-config = { path = "crates/hyscribe-config" }
hyscribe-db = { path = "crates/hyscribe-db" }
hyscribe-service = { path = "crates/hyscribe-service" }
hyscribe-phpser = { path = "crates/hyscribe-phpser" }
hyscribe-render = { path = "crates/hyscribe-render" }
hyscribe-testkit = { path = "crates/hyscribe-testkit" }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
dotenvy = "0.15"
proptest = "1.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
