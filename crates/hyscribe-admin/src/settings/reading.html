
<div class="wrap">
<h1>Reading Settings</h1>

<form method="post" action="options.php">
%fields%
%front%<tr>
<th scope="row"><label for="posts_per_page">Number of recent posts shown on archive pages</label></th>
<td>
<input name="posts_per_page" type="number" step="1" min="1" id="posts_per_page" value="%posts_per_page%" class="small-text" />
</td>
</tr>
<tr>
<th scope="row"><label for="posts_per_rss">Number of recent items shown in syndication feeds</label></th>
<td><input name="posts_per_rss" type="number" step="1" min="1" id="posts_per_rss" value="%posts_per_rss%" class="small-text" /></td>
</tr>

<tr>
<th scope="row">For each post in a feed, include </th>
<td><fieldset>
	<legend class="screen-reader-text"><span>For each post in a feed, include</span></legend>
	<p>
		<label><input name="rss_use_excerpt" type="radio" value="0" %full%	/> Full text</label><br />
		<label><input name="rss_use_excerpt" type="radio" value="1" %excerpt% /> Excerpt</label>
	</p>
	<p class="description">
		Your theme determines how content is displayed in browsers. <a href="https://developer.wordpress.org/advanced-administration/wordpress/feeds/">Learn more about feeds</a>.	</p>
</fieldset></td>
</tr>

<tr class="option-site-visibility">
<th scope="row">Search engine visibility </th>
<td><fieldset>
	<legend class="screen-reader-text"><span>Search engine visibility</span></legend>
	<label for="blog_public"><input name="blog_public" type="checkbox" id="blog_public" value="0" %private% />
	Discourage search engines from indexing this site</label>
	<p class="description">It is up to search engines to honor this request.</p>
</fieldset></td>
</tr>

</table>


<p class="submit"><input type="submit" name="submit" id="submit" class="button button-primary" value="Save Changes"  /></p></form>
</div>
