<div class="wrap">
<h1 id="add-new-user">
Add User</h1>

%notice%
<div id="ajax-response"></div>

<p>Create a brand new user and add them to this site.</p>
<form method="post" name="createuser" id="createuser" class="validate" novalidate="novalidate"
	>
<input name="action" type="hidden" value="createuser" />
	%nonce%	<table class="form-table" role="presentation">
	<tr class="form-field form-required">
		<th scope="row"><label for="user_login">Username <span class="description">(required)</span></label></th>
		<td><input name="user_login" type="text" id="user_login" class="ltr" value="" aria-required="true" autocapitalize="none" autocorrect="off" autocomplete="off" maxlength="60" /></td>
	</tr>
	<tr class="form-field form-required">
		<th scope="row"><label for="email">Email <span class="description">(required)</span></label></th>
		<td><input name="email" type="email" id="email" value="" /></td>
	</tr>
		<tr class="form-field">
		<th scope="row"><label for="first_name">First Name </label></th>
		<td><input name="first_name" type="text" id="first_name" value="" /></td>
	</tr>
	<tr class="form-field">
		<th scope="row"><label for="last_name">Last Name </label></th>
		<td><input name="last_name" type="text" id="last_name" value="" /></td>
	</tr>
	<tr class="form-field">
		<th scope="row"><label for="url">Website</label></th>
		<td><input name="url" type="url" id="url" class="code" value="" /></td>
	</tr>
			<tr class="form-field form-required user-pass1-wrap">
		<th scope="row">
			<label for="pass1">
				Password				<span class="description hide-if-js">(required)</span>
			</label>
		</th>
		<td>
			<input type="hidden" value=" " /><!-- #24364 workaround -->
			<button type="button" class="button wp-generate-pw hide-if-no-js">Generate password</button>
			<div class="wp-pwd">
								<div class="password-input-wrapper">
					<input type="password" name="pass1" id="pass1" class="regular-text ltr" autocomplete="new-password" spellcheck="false" data-reveal="1" data-pw="%password%" aria-describedby="pass-strength-result" />
					<div style="display:none" id="pass-strength-result" aria-live="polite"></div>
				</div>
				<button type="button" class="button wp-hide-pw user-new-password-toggle hide-if-no-js" data-toggle="0" aria-label="Hide password">
					<span class="dashicons dashicons-hidden" aria-hidden="true"></span>
					<span class="text">Hide</span>
				</button>
			</div>
		</td>
	</tr>
	<tr class="form-field form-required user-pass2-wrap hide-if-js">
		<th scope="row"><label for="pass2">Repeat Password <span class="description">(required)</span></label></th>
		<td>
		<input type="password" name="pass2" id="pass2" autocomplete="new-password" spellcheck="false" aria-describedby="pass2-desc" />
		<p class="description" id="pass2-desc">Type the password again.</p>
		</td>
	</tr>
	<tr class="pw-weak">
		<th>Confirm Password</th>
		<td>
			<label>
				<input type="checkbox" name="pw_weak" class="pw-checkbox" />
				Confirm use of weak password			</label>
		</td>
	</tr>
	<tr>
		<th scope="row">Send User Notification</th>
		<td>
			<input type="checkbox" name="send_user_notification" id="send_user_notification" value="1"  checked='checked' />
			<label for="send_user_notification">Send the new user an email about their account</label>
		</td>
	</tr>
		%role%</table>

	
	<p class="submit"><input type="submit" name="createuser" id="createusersub" class="button button-primary" value="Add User"  /></p>
</form>
</div>
