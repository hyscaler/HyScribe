# SPDX-License-Identifier: Apache-2.0 OR MIT
# The test extension (ADR 0022): drives every call of the SDK for the host's
# tests and its cost measurement; built from source by build.sh, outside the
# workspace, for wasm32-wasip2.
[package]
name = "hyscribe-ext-guest"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hyscribe-sdk = { path = "../../hyscribe-sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The test theme shares this lockfile and profile.
[workspace]
members = ["theme"]
