# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "hyscribe-http"
description = "The HTTP server: routing, pages and security headers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "query"] }
httpdate = "1.0"
hyper = { version = "1.12", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["server-graceful", "service", "tokio"] }
hyscribe-assets.workspace = true
hyscribe-admin.workspace = true
hyscribe-auth.workspace = true
hyscribe-config.workspace = true
hyscribe-db.workspace = true
hyscribe-kses.workspace = true
hyscribe-model.workspace = true
hyscribe-phpser.workspace = true
hyscribe-render.workspace = true
hyscribe-rest.workspace = true
hyscribe-write.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync"] }

[dev-dependencies]
hyscribe-testkit.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["mysql", "runtime-tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
