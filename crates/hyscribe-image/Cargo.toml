[package]
name = "hyscribe-image"
description = "Image headers, metadata and the sizes WordPress makes of an upload (ADR 0015, MVP 6.1 and 6.3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hyscribe-model.workspace = true
hyscribe-phpser.workspace = true
hyscribe-render.workspace = true
color_quant = "1.1"
gif = { version = "0.14", default-features = false, features = ["std"] }
image-webp = { version = "0.2", default-features = false }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
kamadak-exif = "0.6"
png = { version = "0.18", default-features = false }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

[dev-dependencies]
hyscribe-testkit.workspace = true

[lints]
workspace = true
