# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "hyscribe-mail"
description = "The emails WordPress sends, built as wp_mail() receives them (MVP 8.2), and their transport (ADR 0016)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hyscribe-config.workspace = true
hyscribe-fetch.workspace = true
hyscribe-kses.workspace = true
hyscribe-phpser.workspace = true
hyscribe-render.workspace = true
# The transport only (ADR 0016): no `hostname` or `native-tls`, so no FFI;
# `webpki-roots` only satisfies lettre's build check (rustls-native-certs
# would pull macOS and Windows crates), the host's roots are passed in.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "ring", "webpki-roots", "smtp-transport", "tokio1", "tokio1-rustls"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
hyscribe-testkit.workspace = true
quoted_printable = "0.5.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
