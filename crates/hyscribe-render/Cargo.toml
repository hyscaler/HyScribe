[package]
name = "hyscribe-render"
description = "WordPress content rendering: blocks, shortcodes, formatting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hyscribe-html.workspace = true
hyscribe-kses.workspace = true
hyscribe-model.workspace = true
hyscribe-phpser.workspace = true
hyscribe-theme-json.workspace = true
icu_normalizer.workspace = true
icu_properties.workspace = true
jiff-tzdb.workspace = true
sha2.workspace = true

[features]
# Embeds the fixture themes of `fixtures/themes/` beside the shipped ones, which
# the tests that check child block themes (10.3) switch on; no shipped
# build has it.
fixture-themes = []

[dev-dependencies]
hyscribe-render = { path = ".", features = ["fixture-themes"] }
hyscribe-testkit.workspace = true

[lints]
workspace = true
