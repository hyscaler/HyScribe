# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "hyscribe-service"
description = "Runs HyScribe as a self-managed background service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process", "fs"] }
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }

# The stop requests' named pipe, and Ctrl-C at the console (windows.rs).
[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
