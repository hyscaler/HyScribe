
<header id="site-header" class="site-header">

	<div class="site-branding">
		{% if let Some(logo) = logo %}{{ logo }}{% else if let Some(name) = site_name %}			<div class="site-title">
				<a href="{{ home }}" title="{{ home_label }}" rel="home">
					{{ name }}				</a>
			</div>
			{% if let Some(tagline) = tagline %}			<p class="site-description">
				{{ tagline }}			</p>
			{% endif %}		{% endif %}	</div>

	{% if let Some(nav) = nav %}		<nav class="site-navigation" aria-label="{{ nav_label }}">
			{{ nav }}		</nav>
	{% endif %}</header>
