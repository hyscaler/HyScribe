[package]
name = "hyscribe-write"
description = "WordPress's core write functions, ported over hyscribe-db's writer (MVP 2.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hyscribe-auth.workspace = true
hyscribe-db.workspace = true
hyscribe-html.workspace = true
hyscribe-kses.workspace = true
hyscribe-model.workspace = true
hyscribe-phpser.workspace = true
hyscribe-render.workspace = true

[dev-dependencies]
hyscribe-config.workspace = true
hyscribe-testkit.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["mysql", "runtime-tokio"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }

[lints]
workspace = true
