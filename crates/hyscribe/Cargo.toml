# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "hyscribe"
description = "Rust drop-in replacement for WordPress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# main.rs has no unit tests; it is covered by running the binary.
[[bin]]
name = "hyscribe"
path = "src/main.rs"
test = false

[dependencies]
clap.workspace = true
hyscribe-auth.workspace = true
hyscribe-config.workspace = true
hyscribe-db.workspace = true
hyscribe-http.workspace = true
hyscribe-service.workspace = true
hyscribe-write.workspace = true
rustix = { version = "1.1", default-features = false, features = ["std", "termios"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
hyscribe-phpser.workspace = true
hyscribe-testkit.workspace = true
rustix = { version = "1.1", default-features = false, features = ["std", "termios", "pty"] }
sqlx = { version = "0.9", default-features = false, features = ["mysql", "runtime-tokio"] }
tempfile = "3"

[lints]
workspace = true
