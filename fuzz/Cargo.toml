# SPDX-License-Identifier: AGPL-3.0-or-later
# Fuzz targets, one per parser (docs/SECURITY_MODEL.md). Needs nightly:
#   cargo +nightly fuzz run phpser_decode
[package]
name = "hyscribe-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hyscribe-phpser = { path = "../crates/hyscribe-phpser" }
hyscribe-config = { path = "../crates/hyscribe-config" }
hyscribe-render = { path = "../crates/hyscribe-render" }
hyscribe-http = { path = "../crates/hyscribe-http" }
hyscribe-html = { path = "../crates/hyscribe-html" }

[[bin]]
name = "phpser_decode"
path = "fuzz_targets/phpser_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "phpser_is_serialized"
path = "fuzz_targets/phpser_is_serialized.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wpconfig_parse"
path = "fuzz_targets/wpconfig_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blocks_parse"
path = "fuzz_targets/blocks_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "phpser_json_decode"
path = "fuzz_targets/phpser_json_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_query"
path = "fuzz_targets/http_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wptexturize"
path = "fuzz_targets/wptexturize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_tag_processor"
path = "fuzz_targets/html_tag_processor.rs"
test = false
doc = false
bench = false

[workspace]
