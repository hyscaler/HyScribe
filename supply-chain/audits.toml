[[audits.image-webp]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.2.4"
notes = "Pure Rust WebP decoder and lossless encoder with #![forbid(unsafe_code)] and no unsafe anywhere. No build script, proc macros, or file, network, process or environment access: it reads and writes through the caller's Read, Seek and Write. Depends on byteorder-lite and quick-error. Simple VP8 and VP8L frames are limited to 16384 a side and the extended canvas to a u32 area; the memory limit defaults to unbounded, so callers must check the dimensions before decoding, as hyscribe-image does."

[[audits.inout]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
delta = "0.2.2 -> 0.2.5"
notes = "Lint fixes (as casts replaced by ptr::from_ref, ptr::from_mut and cast) and a rework of PaddedInOutBuf to hold raw pointers, fixing a Stacked Borrows violation. The reworked unsafe code checks that the output buffer holds every block it writes and returns PadError instead of trusting the padding implementation. No build script, new dependencies or I/O."

[[audits.itertools]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.14.0"
notes = "Iterator adaptors over caller supplied iterators, 14,505 lines, depending only on either with default features off; build = false and no proc macro. Eight unsafe sites in two files, all sound. next_array.rs: ArrayBuilder keeps arr[..len] initialised; push indexes arr[len] (panicking at N before any state changes), writes, then increments len; take calls assume_init only when len equals N, after resetting len to 0 and swapping in an uninitialised array, so nothing drops twice; AsMut and Drop cast only the initialised prefix from [MaybeUninit<T>] to [T], which share a layout. either_or_both.rs: insert_left and insert_right move the old value out with ptr::read and write Both back with ptr::write, with nothing between that can panic, and unreachable_unchecked follows an assignment of Both. Size hints only set capacities. No filesystem, network, process or environment access. wasmtime's Cranelift glue uses zip_eq, join and Either."

[[audits.jiff-tzdb]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.1.9"
notes = "A no_std lookup over the IANA Time Zone Database 2026e: a sorted table of zone names and byte ranges into concatenated TZif data embedded with include_bytes, found by an ASCII case insensitive binary search. No unsafe code, build script, proc macros, dependencies, or filesystem, network, process or environment access."

[[audits.jpeg-encoder]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.7.1"
notes = "Pure Rust JPEG encoder. Without the simd feature lib.rs applies forbid(unsafe_code), so the crate has no unsafe code; the only unsafe is the AVX2 module compiled with simd on x86, entered after runtime feature detection with loads and stores on slices of known length. No build script, proc macros or dependencies. Its only filesystem access is Encoder::new_file at a path the caller gives; otherwise output goes to the Write passed in. It encodes pixels and parses no untrusted input. Licensed (MIT OR Apache-2.0) AND IJG."

[[audits.kamadak-exif]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.6.2"
notes = "Exif parser for TIFF, JPEG, HEIF, PNG and WebP over a caller supplied BufRead. One unsafe block in value.rs casts &Value to &UIntValue, a repr(transparent) wrapper, after checking the variant is Byte, Short or Long: sound. Entry counts use checked_mul and are checked against the remaining data before value buffers are allocated, lengths are read through take(len), IFD chains are capped at 8. Depends on mutate_once. No build script, filesystem, network, process or environment access outside tests and docs."

[[audits.lettre]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.11.23"
notes = "Reviewed the modules HyScribe builds with default features off and builder, smtp-transport, tokio1, tokio1-rustls, ring and webpki-roots: message (builder, headers, mailbox parsing and Display, MIME parts and body encodings), address (email_address and idna checks), and transport/smtp (client, async connection and net, tls, authentication, commands, extension, response parser, error, connection URL). #![forbid(unsafe_code)] and no build script or proc macros of its own. Network access is the SMTP connection to the host the caller names; TLS goes through tokio-rustls with only the root certificates the caller adds (CertificateStore::None, so the webpki-roots feature, which its build check requires, loads nothing), and the dangerous_accept_invalid_* switches stay off. Tls::Required fails when the server does not offer STARTTLS. Header values with CR or LF cannot be written: the quoted string writer returns fmt::Error for them, and the encoder RFC 2047 encodes other control characters. The response parser (nom) bounds every read; with the tracing feature off nothing is logged, so credentials and messages are not. The sendmail and file transports, which run a process and write files, and the hostname, native-tls, boring-tls, dkim, pool and serde features are compiled out."

[[audits.lettre]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
delta = "0.11.23 -> 0.11.24"
notes = "The RUSTSEC-2026-0565 fix: SMTP replies are read line by line into a buffer capped at MAX_RESPONSE_BYTES (100,000) through a new ResponseParser, so a line that never ends cannot take memory without bound. Also: bytes already buffered after the STARTTLS reply end the connection instead of being read as if they came over TLS; DATA and the message end must get replies of the expected class; NOOP needs a 250; an opt-in for partially rejected recipients (off by default). Still #![forbid(unsafe_code)]; no build script, proc macros, or new filesystem, process or environment access; dependency changes are only minimum version bumps of existing ones."

[[audits.memfd]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
delta = "0.6.5 -> 0.6.6"
notes = "Packaging only: the CI workflow, the order of Cargo.toml's metadata tables and the version. No change to any Rust source, build script or dependency."

[[audits.mutate_once]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.1.2"
notes = "A write once, read many interior mutability cell. Three unsafe blocks turn its UnsafeCell into a reference; a Cell state machine panics on a second mutable borrow, refuses mutation once a shared reference is out and resets in the guard's Drop, so they are sound, and the type is not Sync. No dependencies, build script or I/O."

[[audits.nom]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "8.0.0"
notes = "Parser combinators. No build script, proc macros, or filesystem, network, process or environment access. The unsafe code is in traits.rs: get_unchecked on &str at an index find() returned or at the string's end, both char boundaries, so sound. Depends on memchr. lettre parses SMTP replies with it."

[[audits.png]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
delta = "0.18.0-rc -> 0.18.1"
notes = "Still #![forbid(unsafe_code)], no unsafe added, no build script and no I/O beyond caller supplied readers and writers. Runtime dependencies unchanged; only dev dependencies changed. New target_arch code is safe scalar Paeth unfiltering, and core::simd only behind the opt in unstable feature. Chunk buffers now grow by doubling, capped by and charged to Limits::bytes (64 MiB by default), and more output size calculations fail on overflow: the limits tighten."

[[audits.quick-error]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "2.0.1"
notes = "A single macro_rules! macro generating error enums with Display, Error and From implementations. No unsafe code, build script, proc macros, dependencies or I/O; std::fs and std::env appear only in doc comments and examples."

[[audits.quoted_printable]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.5.2"
notes = "#![forbid(unsafe_code)] and no dependencies. Quoted-printable encode and decode (RFC 2045) over byte slices with Strict and Robust decode modes and line wrapping at 76; pure functions returning owned buffers. No build script, proc macros, or filesystem, network, process or environment access."

[[audits.rustc-hash]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
delta = "2.1.1 -> 2.1.3"
notes = "No unsafe code added. The 64 by 64 bit multiply picks its path with cfg! instead of the pointer width and uses wrapping_mul; byte hashing walks 16 byte chunks with split_first_chunk instead of indexing; Default is derived; the optional rand dependency moves to 0.9. No I/O, build script or new dependency."

[[audits.rustls-webpki]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
delta = "0.103.16 -> 0.103.17"
notes = "Adds a certificate transparency SCT list parser (src/sct.rs) over untrusted::Reader with bounds checked reads and no unsafe code, records the SCT extension instead of treating it as unknown, and adds spki_for_anchor and VerifiedPath::issuer_spki, which rewrap the anchor's SubjectPublicKeyInfo. No new dependencies, build script, I/O or unsafe code."

[[audits.webpki-roots]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "1.0.11"
notes = "Data only: src/lib.rs is #![no_std] and #![forbid(unsafe_code)], and holds one const, TLS_SERVER_ROOTS, a slice of rustls-pki-types TrustAnchor values (subject, public key info, name constraints as byte strings) generated from Mozilla's root store, each commented with its PEM. No functions, build script, proc macros or I/O. Depends on rustls-pki-types only. lettre's rustls build check requires the feature; the mail transport passes CertificateStore::None, so these roots are never loaded (ADR 0016)."

[[audits.weezl]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.1.12"
notes = "Pure Rust LZW encoder and decoder with #![forbid(unsafe_code)] in the library and its lzw binary. No build script or proc macros. No I/O except through the Read, Write or futures streams passed in; file access only in the binary and benches, include_bytes only in test modules. The code table is bounded at 4096 entries, so memory stays fixed whatever the input."

[[audits.zune-core]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.5.3"
notes = "Shared types for the zune decoders: decoder options, colour spaces, bit depths and the byte reader and writer traits. No unsafe code (use_unsafe is only a flag decoders read), no build script, no I/O beyond the Read and Write abstractions it defines. Its log and serde dependencies are optional."

[[audits.zune-jpeg]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.5.15"
notes = "Pure Rust baseline and progressive JPEG decoder over a caller supplied byte source. All unsafe code is SIMD intrinsics compiled only with the x86 or neon feature; with default features off lib.rs applies forbid(unsafe_code), so the crate builds with no unsafe at all. Certified for use without x86 and neon. Width and height are checked against the options' limits before buffers are allocated. No build script, filesystem, network, process or environment access. Depends only on zune-core."

