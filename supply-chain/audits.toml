[[audits.cpp_demangle]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.5.1"
notes = "Itanium C++ symbol demangler, about 13,200 lines, depending only on cfg-if (afl only behind its fuzz feature). The crate denies unsafe_code and allows it at two sites, both sound: reference_newtype in ast.rs casts &Vec<TypeHandle> to a shared reference of a single field newtype whose Drop is unreachable (no repr(transparent), which rustc lays out identically in practice), and parse_number calls from_utf8_unchecked on bytes already filtered to ASCII digits and letters. Parsing is capped by ParseOptions recursion_limit (default 96) and printing by DemangleOptions recursion_limit (default 128), TooMuchRecursion propagating rather than backtracking, so hostile input cannot overflow the stack; output size is not capped, a denial of service risk only for a caller demangling untrusted symbols. The build script generates tests into OUT_DIR from in/ and tests/, which the published package excludes, so it writes nothing. No filesystem, network, process or environment access in the library. HyScribe compiles it out: wasmtime's demangle feature is off."

[[audits.email-encoding]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.4.2"
notes = "#![forbid(unsafe_code)]. RFC 2047 encoded words, RFC 2231 parameters, quoted strings and the base64 and quoted-printable body encoders lettre writes headers and bodies with, over a fmt::Write that folds lines at 76 characters; truncation is at char boundaries. No build script, proc macros, or filesystem, network, process or environment access. Depends on base64 0.23 and memchr."

