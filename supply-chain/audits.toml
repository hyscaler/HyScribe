[[audits.fastrand]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "2.5.0"
notes = "#![forbid(unsafe_code)]. The wyrand generator; the thread local global generator is seeded from a DefaultHasher of Instant::now() and the thread ID (getrandom only on wasm with the js feature). Not cryptographic and documented as such: lettre uses it for MIME boundaries only. No build script, proc macros, or filesystem, network, process or environment access. Replaces the safe-to-run exemption now that it ships through lettre's builder."

[[audits.getrandom]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.2.17"
notes = "Reviewed the Linux and Android path HyScribe builds: the getrandom syscall through libc::syscall, falling back to /dev/urandom (opened O_CLOEXEC once, after polling /dev/random until the pool is ready, behind a pthread mutex) when the kernel lacks the syscall or seccomp blocks it; sys_fill_exact loops on EINTR and bounds every advance with get_mut. The unsafe code is the libc calls and the MaybeUninit slice casts, each sound as written. The other platforms' backends were read for I/O: each calls only its system's RNG. No build script, proc macros, network, process or environment access; std only for io::Error conversions."

[[audits.gif]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.14.2"
notes = "Pure Rust GIF decoder and encoder with #![forbid(unsafe_code)]. No build script or proc macros; the only extern block is an empty documentation include under the optional color_quant feature. No filesystem, network, process or environment access: it reads and writes only the Read, BufRead and Write values passed in. The decoder caps buffer growth with a MemoryLimit (50 MB by default) and fallible try_reserve. Depends on weezl, and on color_quant only with that feature."

