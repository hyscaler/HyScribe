
# cargo-vet audits file

[[audits.blake2]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.10.6"
notes = "Reviewed every source file of the crate. no_std; std only forwards to digest/std. No build script, proc macros, or filesystem, network, process or environment access; the tests, benches and .blb test vectors are dev only. The only unsafe code outside feature gated SIMD is as_bytes.rs, which views [T] as bytes for an unsafe marker trait implemented only on primitive integers and repr(C) tuples of one integer type, so no padding or invalid values; finalize copies two u64x4 (64 bytes) into a 64 byte output. The simd, simd_opt and simd_asm features (platform intrinsics, transmuted shuffles and an inline asm path for 32 bit ARM NEON) need a nightly compiler and stay off with default features off. The portable path matches RFC 7693: IV, sigma, rotations 32, 24, 16 and 63, twelve rounds for BLAKE2b, the parameter block with key and output lengths, and the MAC's zero padded key block hashed as the first block. Its panics are asserts on key, output, salt and persona sizes, which Blake2bMac checks first and answers with InvalidLength, an unreachable! for block sizes other than BLAKE2b's and BLAKE2s's, and copy_from_slice between equal lengths. Dependency: digest 0.10 with its mac feature, which pulls in subtle (covered by imported audits)."

[[audits.blowfish]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.10.0"
notes = "Pure Rust Blowfish with #![deny(unsafe_code)] and no unsafe blocks. No build script, proc macros, or filesystem, network, process or environment access. The P and S tables are the standard Blowfish constants, and the bcrypt key schedule helpers use bounds checked indexing only."

[[audits.cipher]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
delta = "0.4.4 -> 0.5.2"
notes = "Trait restructuring for 0.5 (block and mode backends, tweakable ciphers, stream wrapper behind a feature). The crate now declares #![forbid(unsafe_code)], removing the two unsafe blocks 0.4.4 had. No build script, proc macros, or I/O; include_bytes appears only in feature gated test macros."

[[audits.inout]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
delta = "0.2.2 -> 0.2.5"
notes = "Lint fixes (as casts replaced by ptr::from_ref, ptr::from_mut and cast) and a rework of PaddedInOutBuf to hold raw pointers, fixing a Stacked Borrows violation. The reworked unsafe code checks that the output buffer holds every block it writes and returns PadError instead of trusting the padding implementation. No build script, new dependencies or I/O."

[[audits.jiff-tzdb]]
who = "Devadatta Sahoo <webmaster@nettantra.com>"
criteria = "safe-to-deploy"
version = "0.1.9"
notes = "A no_std lookup over the IANA Time Zone Database 2026e: a sorted table of zone names and byte ranges into concatenated TZif data embedded with include_bytes, found by an ASCII case insensitive binary search. No unsafe code, build script, proc macros, dependencies, or filesystem, network, process or environment access."
